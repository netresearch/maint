name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Match the dashboard runtime: PyYAML 6.0.3 has no cp315 wheel,
      # and the binary-only dependency policy intentionally refuses its sdist.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      - name: Install test dependencies
        # beautifulsoup4 is not optional: tests/test_check_stars.py imports
        # scripts/check-stars.py at module scope, so without it pytest fails
        # during collection rather than in a single test.
        # Hash-pinned and wheels-only, as in requirements/. `--require-hashes`
        # fixes the whole resolved tree rather than the three top-level names,
        # and `--only-binary :all:` refuses sdists, whose build step would run
        # a dependency's setup.py on the runner.
        # Block scalar because `:all:` would otherwise read as a YAML mapping.
        run: |
          pip install --only-binary :all: --require-hashes -r requirements/tests.txt

      - name: Run tests
        run: pytest tests/ -v

  # star-notifications.yml installs its own lock on Python 3.15 every 15
  # minutes. Installing it here makes a lock that no longer resolves under
  # --require-hashes fail the pull request instead of the schedule.
  star-notifications-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      - name: Install star-notification dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r requirements/star-notifications.txt
