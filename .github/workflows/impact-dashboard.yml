name: Impact Dashboard

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # Required to push to gh-pages
  packages: read    # For GHCR container package enumeration (best effort)

concurrency:
  group: impact-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout existing gh-pages (best effort)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Seed build dir with previous snapshots, history and archived pages
        run: |
          mkdir -p build
          if [ -d gh-pages/data ]; then
            cp -r gh-pages/data build/
            echo "Seeded build/data with $(find build/data -type f | wc -l) existing files."
          else
            echo "No previous gh-pages data — starting fresh."
          fi
          # Archived snapshot pages are written once and never regenerated: a
          # cited snapshot URL has to keep showing the figures it showed when it
          # was cited. Seeding them makes the renderer skip them.
          for dir in gh-pages/snapshot gh-pages/de/snapshot; do
            [ -d "$dir" ] || continue
            target="build/${dir#gh-pages/}"
            mkdir -p "$(dirname "$target")"
            cp -r "$dir" "$target"
          done

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        # Pinned and binary-only: an unpinned install resolves to whatever was
        # published this morning, and a source distribution runs its own setup
        # script during installation.
        run: >-
          pip install --only-binary :all:
          requests==2.34.2 PyYAML==6.0.3 Jinja2==3.1.6

      - name: Collect impact metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPACT_DASHBOARD_PAT: ${{ secrets.IMPACT_DASHBOARD_PAT }}
          ORG_NAME: netresearch
          OUTPUT_DIR: build
        run: python scripts/collect_impact.py

      - name: Render static site
        env:
          OUTPUT_DIR: build
        run: python scripts/render_site.py

      # Gate the artefact, not the source: placeholders, missing metadata, an
      # uncaveated estimate or a third-party asset request fail here rather than
      # on the live site.
      - name: Verify rendered site
        env:
          OUTPUT_DIR: build
        run: python scripts/verify_site.py

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'chore(dashboard): update impact metrics'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
