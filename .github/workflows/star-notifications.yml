name: Star Notifications

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:  # Manual trigger

concurrency:
  group: star-notifications
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Download previous state
        uses: dawidd6/action-download-artifact@57aa996fc1713cc1579039614f4645a7f4841fd4 # v23
        with:
          name: stars-state
          path: state/
          workflow_conclusion: ''
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Check for new stars
        env:
          # Since 2026-06-30 the stargazers and subscribers endpoints are readable
          # only by a repo's admins/collaborators, which the Actions GITHUB_TOKEN is
          # not. Needs a fine-grained PAT (Metadata: read) on the netresearch org.
          # https://github.blog/changelog/2026-06-30-upcoming-access-restrictions-to-public-api-endpoints-and-ui-views/
          GITHUB_TOKEN: ${{ secrets.STAR_NOTIFICATIONS_PAT }}
          MATRIX_WEBHOOK_URL: ${{ secrets.MATRIX_WEBHOOK_URL }}
          ORG_NAME: netresearch
        run: python scripts/check-stars.py

      - name: Upload updated state
        # Also on a failed run, because the state file carries the cross-run
        # count of consecutive rate-limit hand-overs, and the run that trips the
        # threshold is red by design — with the default `success()` that count
        # would be the one thing never persisted, freezing the streak one below
        # the threshold and understating it in every later error message. Safe
        # because a failed run never reaches save_state(): the file it uploads
        # is the downloaded one plus that counter. Cancellation is excluded, as
        # it can land mid-write and upload a truncated file.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stars-state
          path: state/stars-state.json
          retention-days: 90
          overwrite: true
