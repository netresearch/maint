provenance:
  heading: Data and provenance
  generated: Generated at
  sources_heading: Sources used
  sources:
    - GitHub REST API — repositories, issues, pull requests, releases, contributors, commits
    - GitHub dependency graph — dependent repositories and packages
    - Packagist — download counts for published PHP packages
    - GitHub Container Registry — container pull counts
  coverage_heading: Coverage
  coverage: >-
    Every non-archived repository in the organisation that the collector's
    configuration lists. Archived repositories are collected but excluded from
    the totals.
  gaps_heading: Known gaps
  gaps:
    - >-
      Traffic figures (views and clones) need a token with repository scope. When
      that token is absent the fields are omitted rather than reported as zero.
    - >-
      Dependent counts come from GitHub's dependency graph, which only sees public
      repositories that declare the dependency. Treat them as a lower bound.
    - >-
      Container pull counts are collected on a best-effort basis and can be
      incomplete when a package is not linked to its repository.
    - >-
      Commit counts come from the commits API and are subject to its own limits on
      very large histories.
  history_heading: Historical coverage
  history_from: Daily snapshots have been recorded since

method:
  heading: Methodology
  intro: What each figure means, and what it does not.
  cumulative_heading: Cumulative or point-in-time?
  cumulative: >-
    Releases, downloads, commits, issues and pull requests are cumulative totals
    over the lifetime of each repository. Stars, forks, watchers and dependent
    counts are point-in-time values read at collection. Everything labelled
    "30 days" is a rolling window ending at the generation time — it is resampled
    on every run and is not a calendar month.
  not_measured_heading: Not measured
  not_measured:
    - Private repositories and internal forks.
    - Usage that leaves no public trace — vendored copies, mirrors, tarball installs.
    - Revenue, project value or customer impact. Nothing on this page is a business outcome.
    - Code quality. Activity is not a quality measure.

reach:
  heading: Estimated downstream reach
  lead: >-
    A single indicative number combining the signals that suggest a project is
    used and worked on beyond its own repository.
  formula_heading: How it is calculated
  warning: >-
    An estimate, not a reach or revenue figure. The weights are a judgement call,
    not a measurement, and the inputs carry the gaps listed above. Use it to sort,
    not to decide.
  components:
    external_contributors: External contributors
    issues: Issues opened, open and closed
    prs_merged: Pull requests merged
    forks: Forks
    dependents_repos: Dependent repositories

