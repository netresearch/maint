provenance:
  heading: Daten und Herkunft
  generated: Erhoben am
  sources_heading: Verwendete Quellen
  sources:
    - GitHub-REST-API – Repositories, Issues, Pull Requests, Releases, Mitwirkende, Commits
    - GitHub-Dependency-Graph – abhängige Repositories und Pakete
    - Packagist – Download-Zahlen der veröffentlichten PHP-Pakete
    - GitHub Container Registry – Abrufzahlen der Container
  coverage_heading: Abdeckung
  coverage: >-
    Jedes nicht archivierte Repository der Organisation, das die Konfiguration des
    Sammlers aufführt. Archivierte Repositories werden erhoben, fließen aber nicht
    in die Summen ein.
  gaps_heading: Bekannte Lücken
  gaps:
    - >-
      Traffic-Werte (Aufrufe und Klone) brauchen ein Token mit Repository-Berechtigung.
      Fehlt es, entfallen die Felder – sie werden nicht als Null ausgewiesen.
    - >-
      Die Zahl abhängiger Projekte stammt aus dem Dependency-Graph von GitHub, der
      nur öffentliche Repositories mit deklarierter Abhängigkeit sieht. Sie ist eine
      Untergrenze.
    - >-
      Container-Abrufe werden nach bestem Bemühen erhoben und können unvollständig
      sein, wenn ein Paket nicht mit seinem Repository verknüpft ist.
    - >-
      Commit-Zahlen stammen aus der Commits-API und unterliegen deren Grenzen bei
      sehr großen Historien.
  history_heading: Historische Abdeckung
  history_from: Tägliche Momentaufnahmen werden erfasst seit

method:
  heading: Methodik
  intro: Was jede Zahl bedeutet – und was nicht.
  cumulative_heading: Kumuliert oder Momentwert?
  cumulative: >-
    Releases, Downloads, Commits, Issues und Pull Requests sind kumulierte Summen
    über die Lebensdauer des jeweiligen Repositories. Sterne, Forks, Beobachter und
    abhängige Projekte sind Momentwerte zum Erhebungszeitpunkt. Alles mit
    „30 Tage“ ist ein gleitendes Fenster bis zum Erhebungszeitpunkt – es wird bei
    jedem Lauf neu gebildet und ist kein Kalendermonat.
  not_measured_heading: Nicht gemessen
  not_measured:
    - Private Repositories und interne Forks.
    - Nutzung ohne öffentliche Spur – mitgelieferte Kopien, Spiegel, Installation aus Archiven.
    - Umsatz, Projektwert oder Kundennutzen. Nichts auf dieser Seite ist eine Geschäftskennzahl.
    - Codequalität. Aktivität ist kein Qualitätsmaß.

reach:
  heading: Geschätzte nachgelagerte Reichweite
  lead: >-
    Eine einzelne Richtzahl, die jene Signale zusammenfasst, die dafür sprechen,
    dass ein Projekt über das eigene Repository hinaus genutzt und bearbeitet wird.
  formula_heading: Wie sie berechnet wird
  warning: >-
    Ein Schätzindikator, kein belastbarer Reichweiten- oder Umsatzwert. Die
    Gewichte sind eine Setzung, keine Messung, und die Eingangsgrößen tragen die
    oben genannten Lücken. Zum Sortieren geeignet, nicht zum Entscheiden.
  components:
    external_contributors: Externe Mitwirkende
    issues: Geöffnete, offene und geschlossene Issues
    prs_merged: Gemergte Pull Requests
    forks: Forks
    dependents_repos: Abhängige Repositories

